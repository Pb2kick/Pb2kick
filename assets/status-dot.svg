<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <style>
    /* A soft ring grows and fades from the dot, like the portfolio's status dot. */
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: .7; }
      75%  { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    /* Reduced motion (e.g. Windows animations off): no movement, just a gentle fade. */
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      .ring { animation: none; opacity: 0; }
      .dot  { animation: breathe 2.4s ease-in-out infinite; }
    }
  </style>
  <circle class="ring" cx="9" cy="9" r="4" fill="#45d33a"/>
  <circle class="dot" cx="9" cy="9" r="4" fill="#45d33a"/>
</svg>
